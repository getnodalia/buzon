#
# SonarQube Cloud analysis settings.
sonar.projectKey=getnodalia_buzon
sonar.organization=getnodalia

# src/styles.css is GTK CSS, not web CSS. Sonar checks it against the web
# CSS grammar and flags valid GTK: currentColor in background/border/shadow,
# the mix() colour function, and GTK-only nodes such as slider, row or
# window.csd. Those are not defects, and rewriting them would break the GTK
# theme, so the file is left out of the CSS analysis.
sonar.exclusions=src/styles.css
