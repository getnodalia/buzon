name: Release from main

# Releases Buzón when a new version lands on main: bump the version and add
# docs/release-notes/vX.Y.Z.md in the same pull request, then merge it. Foundation's release-tag
# tags the merge and drafts the release with those notes, the packaging workflows attach their
# files, and release-publish publishes it once all of them pass. A failed platform leaves the
# release a draft. Any other push does nothing.
#
# If a platform fails and its fix lands after the tag, run this by hand on main with
# retag-draft: while the release is still a draft, its tag moves to the fixed commit and every
# platform builds again.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retag-draft:
        description: "Move an unpublished draft's tag to this commit and build it again"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-auto
  cancel-in-progress: false

jobs:
  tag:
    permissions:
      contents: write
    uses: getnodalia/foundation/.github/workflows/release-tag.yml@7964f20499fbbe78c855fee7e90d182aff4aae89
    with:
      name: Buzón
      notes-check: scripts/check-release-notes.sh
      retag-draft: ${{ inputs.retag-draft == true }}

  # One job per platform; each workflow takes `tag` through workflow_call, checks it against
  # the manifest, builds on standard runners and attaches its files with SHA256SUMS.
  linux:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  # Buzón has no macOS or Windows build yet (WebKitGTK); add their jobs here when it does.

  publish:
    needs: [tag, linux]
    permissions:
      contents: write
    uses: getnodalia/foundation/.github/workflows/release-publish.yml@7964f20499fbbe78c855fee7e90d182aff4aae89
    with:
      tag: ${{ needs.tag.outputs.tag }}
